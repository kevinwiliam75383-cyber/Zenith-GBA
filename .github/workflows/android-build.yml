

name: Build Zenith GBA Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zenith GBA
        uses: actions/checkout@v4

      - name: Checkout SkyEmu engine
        uses: actions/checkout@v4
        with:
          repository: skylersaleh/SkyEmu
          ref: dev
          path: skyemu
      - name: Install Zenith GBA logo
        run: |
          unzip -o Zenith-GBA-v03-logo-resources.zip -d logo_patch
          cp -R logo_patch/app/src/main/res/. skyemu/tools/android_project/app/src/main/res/
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-33" "build-tools;35.0.0"

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Brand as Zenith GBA
        working-directory: skyemu
        run: |
          sed -i 's/>SkyEmu</>Zenith GBA</' tools/android_project/app/src/main/res/values/strings.xml

      - name: Build Android DEBUG APK
        working-directory: skyemu/tools/android_project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Zenith-GBA-v0.2-debug.apk"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-GBA-v0.2-DEBUG-APK
          path: output/Zenith-GBA-v0.2-debug.apk
          if-no-files-found: error

      - name: Upload upstream license
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-GBA-SkyEmu-license
          path: skyemu/LICENSE
